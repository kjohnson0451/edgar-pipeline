apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgar-parser-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edgar-parser
  template:
    metadata:
      labels:
        app: edgar-parser
    spec:
      containers:
        - name: parser
          image: python:3.12-slim
          command: ["sleep", "infinity"]
          ports:
            - containerPort: 8000
              name: parser-port
              protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: edgar-parser-svc
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8000
      targetPort: parser-port
  selector:
    app: edgar-parser
