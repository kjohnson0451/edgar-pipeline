apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgar-api-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edgar-api
  template:
    metadata:
      labels:
        app: edgar-api
    spec:
      containers:
        - name: api
          image: python:3.12-slim
          command: ["sleep", "infinity"]
