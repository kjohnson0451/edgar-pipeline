apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgar-api-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edgar-api
  template:
    metadata:
      labels:
        app: edgar-api
    spec:
      containers:
        - name: api
          image: python:3.12-slim
          command: ["sleep", "infinity"]
          ports:
            - containerPort: 8000
              name: api-port
              protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: edgar-api-svc
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8000
      targetPort: api-port
  selector:
    app: edgar-api
