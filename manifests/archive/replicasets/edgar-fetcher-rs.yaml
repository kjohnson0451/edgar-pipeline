apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: edgar-fetcher-rs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edgar-fetcher
  template:
    metadata:
      labels:
        app: edgar-fetcher
    spec:
      containers:
        - name: fetcher
          image: python:3.12-slim
          command: ["sleep", "infinity"]
